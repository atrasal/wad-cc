<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="fb-header d-flex justify-content-between align-items-center px-4">
        <h2 class="mb-0">Facebook</h2>

        <div class="d-flex gap-2">
            <input type="text" class="form-control" placeholder="Email" style="width: 150px;">
            <input type="password" class="form-control" placeholder="Password" style="width: 150px;">
            <button class="btn btn-light">Login</button>
        </div>
    </div>
    <div class="container mt-5">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h3>Facebook helps you connect and share with people in your life.</h3>
                <img src="download.jpeg" class="img-fluid">
            </div>
            <div class="col-md-6">
                <div class="signup-box shadow">
                    <h2>Create an Account</h2>
                    <p>It's free and always will be.</p>

                    <div class="row">
                        <div class="col">
                            <input type="text" class="form-control mb-2" placeholder="First Name">
                        </div>
                        <div class="col">
                            <input type="text" class="form-control mb-2" placeholder="Last Name">
                        </div>
                    </div>
                    <input type="email" class="form-control mb-2" placeholder="Enter email">
                    <input type="email" class="form-control mb-2" placeholder="Re-enter email">
                    <input type="password" class="form-control mb-2" placeholder="Password">

                    <input type="date" class="form-control mb-2">

                    <div class="mb-2">
                        <input type="radio" name="gender"> Male
                        <input type="radio" name="gender"> Female
                    </div>

                    <button class="btn btn-success w-100"> Sign up</button>
                    <p class="mt-2" style="font-size: 12px;">
                        By clicking Sign up, you agree to our Terms and that you have read our Data Policy, including our Cookie Use.
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
