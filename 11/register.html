<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <h2>Registration</h2>
    <form onsubmit="registerUser(event)">
        <input type="text" name="" id="name" placeholder="Name"><br>
        <input type="email" name="" id="email" placeholder="Email"><br>
        <input type="tel" id="mobile" placeholder="Mobile" pattern="[0-9]{10}" required><br>
        <input type="date" id="dob" required><br>
        <input type="text" id="city" placeholder="City" required><br>
        <input type="text" id="address" placeholder="Address" required><br>
        <input type="password" id="password" placeholder="Password" required><br>

        <button type="submit">Register</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
